<html><body>Reports <code>X := X + 1</code> and <code>X := X - 1</code> on an integer variable, field or array element and offers to replace them with <code>Inc(X)</code> or <code>Dec(X)</code>. Only the literal 1 is reported: PascalScript's <code>Inc</code> and <code>Dec</code> take no second argument.</body></html>
